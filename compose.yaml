# Donation Management API + SQL Server
# Start:  docker compose up -d --build      Stop:  docker compose down
# Values like ${DB_PASSWORD} come from the .env file next to this file (see .env.example).
name: donation-api

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: donation-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    ports:
      # optional: lets SSMS / Azure Data Studio on the host connect to localhost,14333
      - "${DB_HOST_PORT:-14333}:1433"
    volumes:
      - donation-db-data:/var/opt/mssql   # data survives "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build: .
    image: donation-api:latest
    container_name: donation-api
    depends_on:
      db:
        condition: service_healthy   # start the API only when SQL Server accepts connections
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # "db" is the service name above: containers on the same compose network find each other by name
      ConnectionStrings__Default: "Server=db,1433;Database=${DB_NAME:-DonationDb};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Database__MigrateOnStartup: "true"
    ports:
      - "${API_PORT:-5207}:8080"
    restart: unless-stopped

volumes:
  donation-db-data:
